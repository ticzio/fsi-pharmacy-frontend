<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/logo_fsi.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/logo_fsi.png" />
  <link rel="apple-touch-icon" href="/logo_fsi.png" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet" />
  <title>FSI (Farmacias)</title>
</head>

<body>
  <!-- Loader inicial mientras se inicializa la API -->
  <div id="app-loader" style="
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #0d2f6e 0%, #123e93 40%, #1a52b0 70%, #123e93 100%);
    font-family: 'Lexend Deca', sans-serif;
    overflow: hidden;
  ">
    <!-- Floating ambient particles -->
    <div style="position:absolute;inset:0;pointer-events:none;overflow:hidden;">
      <div
        style="position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.04) 0%,transparent 70%);top:-80px;right:-60px;animation:float 8s ease-in-out infinite;">
      </div>
      <div
        style="position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.03) 0%,transparent 70%);bottom:-40px;left:-30px;animation:float 10s ease-in-out infinite reverse;">
      </div>
      <div
        style="position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.025) 0%,transparent 70%);top:50%;left:60%;animation:float 12s ease-in-out infinite 2s;">
      </div>
    </div>

    <!-- Loader card -->
    <div style="
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 56px;
      border-radius: 24px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.08);
    ">
      <!-- Logo with glow -->
      <div style="position:relative;margin-bottom:28px;">
        <div style="
          position: absolute;
          inset: -16px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(26,82,176,0.5) 0%, transparent 70%);
          animation: logoGlow 2.5s ease-in-out infinite;
        "></div>
        <img src="logo_fsi.png" alt="FSI" style="
          position: relative;
          width: 88px;
          height: 88px;
          filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
          animation: logoPulse 2.5s ease-in-out infinite;
        " />
      </div>

      <!-- App title -->
      <p style="
        color: #fff;
        font-size: 1.1rem;
        font-weight: 500;
        letter-spacing: 0.5px;
        margin: 0 0 24px 0;
        opacity: 0.95;
      ">Cargando dashboard<span style="animation: dots 1.5s steps(4,end) infinite;">...</span></p>

      <!-- Progress bar -->
      <div style="
        width: 200px;
        height: 4px;
        border-radius: 4px;
        background: rgba(255,255,255,0.12);
        overflow: hidden;
      ">
        <div style="
          width: 40%;
          height: 100%;
          border-radius: 4px;
          background: linear-gradient(90deg, rgba(255,255,255,0.6), #fff, rgba(255,255,255,0.6));
          animation: progressSlide 1.6s ease-in-out infinite;
        "></div>
      </div>
    </div>
  </div>

  <style>
    @keyframes logoPulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.04);
        opacity: 0.9;
      }
    }

    @keyframes logoGlow {

      0%,
      100% {
        opacity: 0.5;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    @keyframes progressSlide {
      0% {
        transform: translateX(-200%);
      }

      100% {
        transform: translateX(600%);
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      33% {
        transform: translate(15px, -20px) scale(1.05);
      }

      66% {
        transform: translate(-10px, 10px) scale(0.95);
      }
    }

    @keyframes dots {
      0% {
        content: '';
      }

      25% {
        content: '.';
      }

      50% {
        content: '..';
      }

      75% {
        content: '...';
      }
    }
  </style>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
