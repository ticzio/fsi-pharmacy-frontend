# Definimos dos etapas: una para construir la aplicación y otra para desplegarla.
stages:
  - build
  - deploy

# ====================================================================
# JOB: build_vue_app
# Etapa: build
# Propósito: Instala dependencias y compila la aplicación Vue.js en un entorno Docker.
# El resultado (carpeta 'dist') se guarda como un 'artifact' para el job de despliegue.
# ====================================================================
build_vue_app:
  stage: build
  # Usamos una imagen de Docker con Node.js 18.
  # 'node:18-alpine' es una imagen ligera y adecuada para entornos de CI.
  image: node:18-alpine # ¡Asegúrate de que la versión 18 de Node.js sea la que necesitas!

  script:
    - echo "Iniciando etapa de construcción de la aplicación en Docker..."
    - echo "  -> Instalando dependencias de Node.js (npm ci para builds limpios)..."
    - npm ci # 'npm ci' es preferible a 'npm install' en CI para builds reproducible.
      # Asegúrate de que tienes un 'package-lock.json' en tu repositorio.
    - echo "  -> Compilando la aplicación Vue.js (npm run build)..."
    - npm run build # Este comando genera tu carpeta 'dist'
    - echo "Construcción completada. Archivos generados en la carpeta 'dist/'."

  artifacts:
    paths:
      - dist/ # Guarda la carpeta 'dist' como un artefacto. Esto la hace disponible para jobs posteriores.
    expire_in: 1 day # Los artefactos se guardarán por 1 día. Ajusta según tus necesidades.

  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "calidad"' # Este job se ejecutará para pushes a develop O calidad.

# ====================================================================
# JOB: deploy_develop_to_vps2021_vps
# Etapa: deploy
# Propósito: Copia los artefactos (carpeta 'dist') del job de build al servidor DIALCA VPS para el entorno de desarrollo.
# ====================================================================
deploy_develop_to_vps2021_vps:
  stage: deploy
  # Las 'tags' deben coincidir con las etiquetas de tu Runner.
  # Este job se ejecuta en el 'shell' executor de tu servidor DIALCA VPS.
  tags:
    - VPS2021 Runner

  before_script:
    # Estos comandos se ejecutan como el usuario 'gitlab-runner' directamente en el servidor.
    #- echo "Preparando entorno del Runner (usuario gitlab-runner)..."
    #- mkdir -p /home/gitlab-runner/.ssh # Asegura el directorio .ssh para el usuario Runner
    #- chmod 700 /home/gitlab-runner/.ssh # Permisos correctos (solo propietario) para el directorio .ssh
    #- echo "Preparación SSH del Runner completada."

  script:
    - echo "Iniciando comandos de despliegue remotos en VPS2021 VPS..."
    # Usamos el alias SSH definido en /home/gitlab-runner/.ssh/config
    - export SSH_CMD="ssh deploy_vps2021"
    # Define la ruta absoluta del proyecto en el servidor para el entorno DEVELOP.
    - export PROJECT_PATH="/var/www/TESTING/fsi/fsi-admin-frontend"

    # Los comandos siguientes se ejecutan *en el servidor remoto* como 'deployuser'.

    # Asegurar la propiedad y permisos del directorio del proyecto para deployuser
    # ESTOS COMANDOS ASUMEN QUE EL 'deployuser' YA ES EL PROPIETARIO DE ${PROJECT_PATH}
    # Y TIENE PERMISOS PARA ESCRIBIR EN ÉL (CONFIGURACIÓN MANUAL EN EL SERVIDOR).
    # Si no es así, ESTOS COMANDOS FALLARÁN SIN SUDO.
    - echo "  -> Verificando propiedad y permisos del proyecto para deployuser (DEVELOP)..."
    # Eliminado 'sudo' de chown/chmod aquí, ya que se asume que 'deployuser' es dueño.
    # Si el directorio no existe, se creará en el paso de 'rm -rf' y 'mkdir -p'.
    # - $SSH_CMD "chown -R deployuser:deployuser \"${PROJECT_PATH}\""
    # - $SSH_CMD "chmod -R u+rwX \"${PROJECT_PATH}\""

    # Añadir el directorio a la lista de directorios seguros de Git.
    - echo "  -> Configurando Git para confiar en la propiedad del directorio..."
    - $SSH_CMD "git config --global --add safe.directory \"${PROJECT_PATH}\""

    # Asegurar que el directorio .ssh del deployuser existe y tiene los permisos correctos
    - echo "  -> Asegurando directorio .ssh para deployuser..."
    - $SSH_CMD "mkdir -p ~/.ssh && chmod 700 ~/.ssh"

    # Añadir la huella digital de gitlab.com al known_hosts del deployuser.
    - echo "  -> Añadiendo gitlab.com a known_hosts de deployuser..."
    - $SSH_CMD "ssh-keyscan gitlab.com >> ~/.ssh/known_hosts 2>/dev/null || true"
    - $SSH_CMD "chmod 644 ~/.ssh/known_hosts"

    # --- INICIO DE LA LÓGICA DE GIT PULL/RESET MEJORADA ---
    # Asegurar que la URL remota de 'origin' es SSH para el deployuser
    - echo "  -> Configurando URL remota de Git a SSH para deployuser..."
    - $SSH_CMD "cd \"${PROJECT_PATH}\" && git remote set-url origin git@gitlab.com:ticktapsoftware/fsi/fsi-admin-frontend.git"

    # Primero, asegúrate de que el repositorio local esté limpio y actualizado con el remoto.
    - echo "  -> Actualizando información de ramas remotas..."
    - $SSH_CMD "cd \"${PROJECT_PATH}\" && git fetch origin develop"

    - echo "  -> Reiniciando la rama local 'develop' para que coincida con 'origin/develop'..."
    - $SSH_CMD "cd \"${PROJECT_PATH}\" && git reset --hard origin/develop"

    # Ahora, el pull debería funcionar sin problemas, ya que la rama local ya coincide con la remota.
    - echo "  -> Realizando git pull origin develop en ${PROJECT_PATH} (fast-forward only)..."
    - $SSH_CMD "cd \"${PROJECT_PATH}\" && git pull origin develop --ff-only"
    # --- FIN DE LA LÓGICA DE GIT PULL/RESET MEJORADA ---

    # --- COPIA DE ARTEFACTOS CON SCP ---
    - echo "  -> Copiando artefactos (carpeta dist/) al servidor usando SCP..."
    # Configuración de opciones SCP
    - export SCP_OPTIONS="-r -P 2079 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    # 1. Borrar la carpeta 'dist' existente en el servidor para una copia limpia
    - $SSH_CMD "rm -rf \"${PROJECT_PATH}/dist\"" # Eliminado 'sudo' aquí
    # 2. Crear la carpeta dist con permisos correctos ANTES de copiar
    - $SSH_CMD "mkdir -p \"${PROJECT_PATH}/dist\"" # Eliminado 'sudo' aquí
    - $SSH_CMD "chown deployuser:deployuser \"${PROJECT_PATH}/dist\"" # Eliminado 'sudo' aquí
    - $SSH_CMD "chmod 755 \"${PROJECT_PATH}/dist\"" # Eliminado 'sudo' aquí
    # 3. Copiar la nueva carpeta 'dist' recursivamente desde el Runner al servidor
    - scp $SCP_OPTIONS dist/ deploy_vps2021:"${PROJECT_PATH}/" # Usando el alias SSH para aprovechar la configuración

    # 4. Copiar el .htaccess a la carpeta dist (Este comando ya usa SSH_CMD)
    - echo "  -> Copiando .htaccess a ${PROJECT_PATH}/dist/..."
    - $SSH_CMD "cp \"${PROJECT_PATH}/.htaccess\" \"${PROJECT_PATH}/dist/.htaccess\""
    # Si 'deployuser' necesita 'sudo cp' y tiene permisos para ello sin contraseña:
    # - $SSH_CMD "sudo cp \"${PROJECT_PATH}/.htaccess\" \"${PROJECT_PATH}/dist/.htaccess\""

    - echo "Despliegue de 'vps2021-frontend' completado en VPS2021 VPS."

  environment:
    name: develop/VPS2021-VPS/vps2021-frontend
    url: http://your-project-domain.com # ¡REEMPLAZA CON LA URL REAL!

  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"' # Se ejecuta solo si el push es a la rama 'develop'.
      when: on_success # Se ejecuta si el job de 'build_vue_app' fue exitoso.

# ====================================================================
# JOB: deploy_calidad_to_vps2021_vps
# Etapa: deploy
# Propósito: Copia los artefactos (carpeta 'dist') del job de build al servidor DIALCA VPS para el entorno de calidad.
# ====================================================================
deploy_calidad_to_vps2021_vps:
  stage: deploy
  # Las 'tags' deben coincidir con las etiquetas de tu Runner.
  tags:
    - VPS2021 Runner

  before_script:
    # Estos comandos se ejecutan como el usuario 'gitlab-runner' directamente en el servidor.
    - echo "Preparando entorno del Runner (usuario gitlab-runner)..."
    - mkdir -p /home/gitlab-runner/.ssh
    - chmod 700 /home/gitlab-runner/.ssh
    - echo "Preparación SSH del Runner completada."

  script:
    - echo "Iniciando comandos de despliegue remotos en VPS2021 VPS para CALIDAD..."
    - export SSH_CMD="ssh deploy_vps2021"
    # Define la ruta absoluta del proyecto en el servidor para el entorno CALIDAD.
    - export PROJECT_PATH="/var/www/CALIDAD/fsi/fsi-admin-frontend"

    # Asegurar la propiedad y permisos del directorio del proyecto para deployuser
    # ESTOS COMANDOS ASUMEN QUE EL 'deployuser' YA ES EL PROPIETARIO DE ${PROJECT_PATH}
    # Y TIENE PERMISOS PARA ESCRIBIR EN ÉL (CONFIGURACIÓN MANUAL EN EL SERVIDOR).
    # Si no es así, ESTOS COMANDOS FALLARÁN SIN SUDO.
    - echo "  -> Verificando propiedad y permisos del proyecto para deployuser (CALIDAD)..."
    # Eliminado 'sudo' de chown/chmod aquí, ya que se asume que 'deployuser' es dueño.
    # - $SSH_CMD "chown -R deployuser:deployuser \"${PROJECT_PATH}\""
    # - $SSH_CMD "chmod -R u+rwX \"${PROJECT_PATH}\""

    # Añadir el directorio a la lista de directorios seguros de Git.
    - echo "  -> Configurando Git para confiar en la propiedad del directorio..."
    - $SSH_CMD "git config --global --add safe.directory \"${PROJECT_PATH}\""

    # Asegurar que el directorio .ssh del deployuser existe y tiene los permisos correctos
    - echo "  -> Asegurando directorio .ssh para deployuser..."
    - $SSH_CMD "mkdir -p ~/.ssh && chmod 700 ~/.ssh"

    # Añadir la huella digital de gitlab.com al known_hosts del deployuser.
    - echo "  -> Añadiendo gitlab.com a known_hosts de deployuser..."
    - $SSH_CMD "ssh-keyscan gitlab.com >> ~/.ssh/known_hosts 2>/dev/null || true"
    - $SSH_CMD "chmod 644 ~/.ssh/known_hosts"

    # --- LÓGICA DE GIT PULL/RESET MEJORADA PARA CALIDAD ---
    # Asegurar que la URL remota de 'origin' es SSH para el deployuser
    - echo "  -> Configurando URL remota de Git a SSH para deployuser..."
    - $SSH_CMD "cd \"${PROJECT_PATH}\" && git remote set-url origin git@gitlab.com:ticktapsoftware/fsi/fsi-admin-frontend.git"

    - echo "  -> Actualizando información de ramas remotas para CALIDAD..."
    - $SSH_CMD "cd \"${PROJECT_PATH}\" && git fetch origin calidad"

    - echo "  -> Reiniciando la rama local 'calidad' para que coincida con 'origin/calidad'..."
    - $SSH_CMD "cd \"${PROJECT_PATH}\" && git reset --hard origin/calidad"

    - echo "  -> Realizando git pull origin calidad en ${PROJECT_PATH} (fast-forward only)..."
    - $SSH_CMD "cd \"${PROJECT_PATH}\" && git pull origin calidad --ff-only"
    # --- FIN DE LA LÓGICA DE GIT PULL/RESET MEJORADA ---

    # --- COPIA DE ARTEFACTOS CON SCP ---
    - echo "  -> Copiando artefactos (carpeta dist/) al servidor usando SCP para CALIDAD..."
    - export SCP_OPTIONS="-r -P 2079 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    - $SSH_CMD "rm -rf \"${PROJECT_PATH}/dist\"" # Eliminado 'sudo' aquí
    # 2. Crear la carpeta dist con permisos correctos ANTES de copiar
    - $SSH_CMD "mkdir -p \"${PROJECT_PATH}/dist\"" # Eliminado 'sudo' aquí
    - $SSH_CMD "chown deployuser:deployuser \"${PROJECT_PATH}/dist\"" # Eliminado 'sudo' aquí
    - $SSH_CMD "chmod 755 \"${PROJECT_PATH}/dist\"" # Eliminado 'sudo' aquí
    # 3. Copiar la nueva carpeta 'dist' recursivamente desde el Runner al servidor
    - scp $SCP_OPTIONS dist/ deploy_vps2021:"${PROJECT_PATH}/" # Usando el alias SSH para aprovechar la configuración

    # Copiar el .htaccess
    - echo "  -> Copiando .htaccess a ${PROJECT_PATH}/dist/ para CALIDAD..."
    - $SSH_CMD "cp \"${PROJECT_PATH}/.htaccess\" \"${PROJECT_PATH}/dist/.htaccess\""

    - echo "Despliegue de 'vps2021-frontend' en CALIDAD completado en VPS2021 VPS."

  environment:
    name: calidad/VPS2021-VPS/vps2021-frontend
    url: http://your-calidad-domain.com # ¡REEMPLAZA CON LA URL REAL PARA CALIDAD!

  rules:
    - if: '$CI_COMMIT_BRANCH == "calidad"' # Se ejecuta solo si el push es a la rama 'calidad'.
      when: on_success # Se ejecuta si el job de 'build_vue_app' fue exitoso.
